  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 font-weight: 600;\n  font-display: swap;\n  src: url(\"5d5a463c-5fa3-4253-b2d7-20d75245ce6c\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Geist Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"40947f7a-12c6-4ef3-9123-6f3a33ae0d25\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  /* ---------- tokens ---------- */\n  :root {\n    --bg:        #0a0c12;\n    --bg-2:      #0f121a;\n    --panel:     #131724;\n    --panel-2:   #181d2c;\n    --panel-3:   #1f2538;\n    --line:      #232a40;\n    --text:      #e6e9f2;\n    --text-2:    #97a0bd;\n    --text-3:    #5b6580;\n    --accent:    #22e07a;       /* electric green — primary CTA / streak */\n    --accent-2:  #8b5cf6;       /* violet — secondary */\n    --warn:      #fbbf24;\n    --pill-bg:   #1c2336;\n    --radius:    12px;\n    --card-w:    176px;\n    --card-h:    234px;\n  }\n\n  /* ---------- reset ---------- */\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; }\n  body {\n    background: var(--bg);\n    color: var(--text);\n    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;\n    -webkit-font-smoothing: antialiased;\n    min-height: 100vh;\n    font-size: 14px;\n    overflow-x: hidden;\n  }\n  a { color: inherit; text-decoration: none; }\n  button { font-family: inherit; cursor: pointer; border: 0; }\n\n  /* ---------- layout ---------- */\n  .app {\n    display: grid;\n    grid-template-columns: 240px 1fr;\n    grid-template-rows: 60px 1fr;\n    grid-template-areas:\n      \"logo  topbar\"\n      \"side  main\";\n    min-height: 100vh;\n  }\n\n  /* ---------- logo / top bar ---------- */\n  .logo-cell {\n    grid-area: logo;\n    display: flex;\n    align-items: center;\n    padding: 0 20px;\n    background: var(--panel);\n    border-right: 1px solid var(--line);\n    border-bottom: 1px solid var(--line);\n    gap: 10px;\n  }\n  .logo-mark {\n    width: 28px; height: 28px;\n    border-radius: 7px;\n    background: linear-gradient(135deg, var(--accent) 0%, #0ea65a 100%);\n    display: grid;\n    place-items: center;\n    font-family: 'Geist Mono', monospace;\n    font-weight: 700;\n    color: #0a0c12;\n    font-size: 14px;\n  }\n  .logo-text {\n    font-weight: 600;\n    font-size: 15px;\n    letter-spacing: -0.3px;\n  }\n  .logo-text em { font-style: normal; color: var(--accent); }\n\n  .topbar {\n    grid-area: topbar;\n    display: flex;\n    align-items: center;\n    padding: 0 24px;\n    background: var(--panel);\n    border-bottom: 1px solid var(--line);\n    gap: 12px;\n  }\n\n  .mode-tabs {\n    display: inline-flex;\n    background: var(--bg);\n    padding: 4px;\n    border-radius: 10px;\n    gap: 2px;\n  }\n  .mode-tab {\n    padding: 7px 16px;\n    border-radius: 7px;\n    font-size: 13px;\n    font-weight: 600;\n    color: var(--text-2);\n    background: transparent;\n    transition: background 160ms, color 160ms;\n  }\n  .mode-tab.is-active {\n    background: var(--panel-3);\n    color: var(--text);\n  }\n\n  .spacer { flex: 1; }\n\n  .top-stats {\n    display: flex;\n    align-items: center;\n    gap: 8px;\n  }\n  .stat-pill {\n    display: inline-flex;\n    align-items: center;\n    gap: 8px;\n    background: var(--bg);\n    padding: 7px 12px 7px 10px;\n    border-radius: 8px;\n    font-family: 'Geist Mono', monospace;\n    font-weight: 500;\n    font-size: 13px;\n    color: var(--text);\n  }\n  .stat-pill .ico { width: 16px; height: 16px; display: grid; place-items: center; }\n  .stat-pill .label { color: var(--text-3); font-family: 'Geist', sans-serif; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; }\n  .stat-pill.xp .num { color: var(--accent); }\n  .stat-pill.streak .num { color: var(--warn); }\n\n  .btn-primary {\n    background: var(--accent);\n    color: #0a0c12;\n    font-weight: 700;\n    padding: 8px 14px;\n    border-radius: 8px;\n    font-size: 13px;\n    transition: filter 160ms, transform 120ms;\n  }\n  .btn-primary:hover { filter: brightness(1.08); }\n  .btn-primary:active { transform: translateY(1px); }\n\n  .icon-btn {\n    width: 36px; height: 36px;\n    display: grid; place-items: center;\n    background: transparent;\n    color: var(--text-2);\n    border-radius: 8px;\n    transition: background 160ms, color 160ms;\n  }\n  .icon-btn:hover { background: var(--panel-3); color: var(--text); }\n\n  .avatar {\n    width: 32px; height: 32px;\n    border-radius: 50%;\n    background: linear-gradient(135deg, #8b5cf6, #ec4899);\n    display: grid; place-items: center;\n    font-weight: 700; font-size: 12px;\n    color: #fff;\n  }\n\n  /* ---------- sidebar ---------- */\n  .sidebar {\n    grid-area: side;\n    background: var(--panel);\n    border-right: 1px solid var(--line);\n    padding: 18px 12px 24px;\n    overflow-y: auto;\n  }\n  .nav-section + .nav-section { margin-top: 18px; }\n  .nav-heading {\n    font-size: 10px;\n    letter-spacing: 1.5px;\n    text-transform: uppercase;\n    color: var(--text-3);\n    padding: 8px 12px 6px;\n    font-weight: 600;\n  }\n  .nav-item {\n    display: flex;\n    align-items: center;\n    gap: 11px;\n    padding: 9px 12px;\n    border-radius: 8px;\n    color: var(--text-2);\n    font-size: 13.5px;\n    font-weight: 500;\n    transition: background 160ms, color 160ms;\n    cursor: pointer;\n  }\n  .nav-item:hover { background: var(--panel-2); color: var(--text); }\n  .nav-item.is-active {\n    background: var(--panel-3);\n    color: var(--text);\n  }\n  .nav-item .ico {\n    width: 18px; height: 18px;\n    display: grid; place-items: center;\n    color: var(--text-3);\n    flex-shrink: 0;\n  }\n  .nav-item.is-active .ico, .nav-item:hover .ico { color: var(--accent); }\n  .nav-item .count {\n    margin-left: auto;\n    font-family: 'Geist Mono', monospace;\n    font-size: 11px;\n    color: var(--text-3);\n    background: var(--bg);\n    padding: 2px 7px;\n    border-radius: 5px;\n  }\n\n  /* ---------- main ---------- */\n  .main {\n    grid-area: main;\n    padding: 24px 32px 60px;\n    overflow-x: hidden;\n  }\n\n  /* ---------- featured banners ---------- */\n  .banners {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 16px;\n    margin-bottom: 28px;\n  }\n  .banner {\n    position: relative;\n    display: flex;\n    align-items: stretch;\n    padding: 22px 24px;\n    border-radius: 14px;\n    min-height: 152px;\n    overflow: hidden;\n    isolation: isolate;\n    border: 1px solid var(--line);\n  }\n  .banner-1 {\n    background:\n      radial-gradient(120% 90% at 100% 0%, rgba(34, 224, 122, 0.22), transparent 55%),\n      linear-gradient(135deg, #0f1c18 0%, #14283d 100%);\n  }\n  .banner-2 {\n    background:\n      radial-gradient(120% 90% at 0% 100%, rgba(139, 92, 246, 0.25), transparent 55%),\n      linear-gradient(135deg, #1a1230 0%, #14283d 100%);\n  }\n  .banner-tag {\n    font-family: 'Geist Mono', monospace;\n    font-size: 11px;\n    letter-spacing: 1.5px;\n    text-transform: uppercase;\n    color: var(--accent);\n    margin-bottom: 8px;\n    font-weight: 600;\n  }\n  .banner-2 .banner-tag { color: var(--accent-2); }\n  .banner h3 {\n    margin: 0 0 6px;\n    font-size: 22px;\n    font-weight: 600;\n    letter-spacing: -0.4px;\n    line-height: 1.15;\n  }\n  .banner p {\n    margin: 0 0 16px;\n    color: var(--text-2);\n    font-size: 13.5px;\n    line-height: 1.45;\n    max-width: 320px;\n  }\n  .banner-cta {\n    display: inline-flex;\n    align-items: center;\n    gap: 6px;\n    background: var(--accent);\n    color: #0a0c12;\n    padding: 9px 16px;\n    border-radius: 8px;\n    font-weight: 700;\n    font-size: 13px;\n    align-self: flex-start;\n    transition: filter 160ms;\n  }\n  .banner-cta:hover { filter: brightness(1.08); }\n  .banner-2 .banner-cta {\n    background: var(--accent-2);\n    color: #fff;\n  }\n  .banner-art {\n    position: absolute;\n    right: -10px;\n    bottom: -10px;\n    width: 200px;\n    height: 200px;\n    opacity: 0.9;\n    pointer-events: none;\n  }\n  .banner-body { display: flex; flex-direction: column; max-width: 60%; position: relative; z-index: 1; }\n\n  /* ---------- search ---------- */\n  .search-row {\n    display: flex;\n    gap: 12px;\n    margin-bottom: 22px;\n  }\n  .search {\n    flex: 1;\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    background: var(--panel);\n    border: 1px solid var(--line);\n    border-radius: 10px;\n    padding: 0 14px;\n    height: 44px;\n    transition: border-color 160ms;\n  }\n  .search:focus-within { border-color: var(--accent); }\n  .search input {\n    flex: 1;\n    background: transparent;\n    border: 0;\n    outline: 0;\n    color: var(--text);\n    font-family: inherit;\n    font-size: 14px;\n  }\n  .search input::placeholder { color: var(--text-3); }\n  .search .kbd {\n    font-family: 'Geist Mono', monospace;\n    font-size: 11px;\n    color: var(--text-3);\n    background: var(--bg);\n    padding: 3px 7px;\n    border-radius: 5px;\n    border: 1px solid var(--line);\n  }\n\n  /* ---------- category tabs ---------- */\n  .cat-tabs {\n    display: flex;\n    align-items: center;\n    gap: 4px;\n    margin-bottom: 20px;\n    flex-wrap: wrap;\n  }\n  .cat-tab {\n    padding: 8px 14px;\n    border-radius: 8px;\n    font-weight: 600;\n    font-size: 13px;\n    color: var(--text-2);\n    background: transparent;\n    display: inline-flex;\n    align-items: center;\n    gap: 7px;\n    transition: background 160ms, color 160ms;\n  }\n  .cat-tab:hover { color: var(--text); background: var(--panel-2); }\n  .cat-tab.is-active {\n    background: var(--panel-3);\n    color: var(--text);\n  }\n  .cat-tab .ico { width: 14px; height: 14px; display: grid; place-items: center; opacity: 0.8; }\n\n  /* ---------- card grid ---------- */\n  .grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));\n    gap: 16px 14px;\n  }\n  .game {\n    position: relative;\n  }\n  .card {\n    position: relative;\n    width: 100%;\n    aspect-ratio: 176 / 234;\n    border-radius: 12px;\n    overflow: hidden;\n    isolation: isolate;\n    cursor: pointer;\n    box-shadow:\n      0 1px 0 rgba(255, 255, 255, 0.16) inset,\n      0 14px 30px -16px rgba(0, 0, 0, 0.7),\n      0 4px 12px -6px rgba(0, 0, 0, 0.5);\n    transition: transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease;\n    --art-shift-x: 0px;\n  }\n  .card:hover {\n    transform: translateY(-8px) scale(1.03);\n    box-shadow:\n      0 1px 0 rgba(255, 255, 255, 0.22) inset,\n      0 28px 56px -16px rgba(0, 0, 0, 0.8),\n      0 10px 22px -8px rgba(0, 0, 0, 0.6);\n    z-index: 2;\n  }\n\n  /* gradient variants (same palette as before) */\n  .g-brain        { background: radial-gradient(120% 80% at 100% 0%, #ff7ac6 0%, transparent 55%), radial-gradient(120% 90% at 0% 100%, #ff8a5b 0%, transparent 60%), linear-gradient(155deg, #6a3df5 0%, #b536e6 45%, #ff5c8a 100%); }\n  .g-combinatorics{ background: radial-gradient(120% 80% at 100% 0%, #5eead4 0%, transparent 55%), radial-gradient(120% 90% at 0% 100%, #0ea5e9 0%, transparent 60%), linear-gradient(155deg, #0b3a6a 0%, #1e6fb8 45%, #22d3ee 100%); }\n  .g-conditional  { background: radial-gradient(120% 80% at 100% 0%, #fde68a 0%, transparent 55%), radial-gradient(120% 90% at 0% 100%, #f97316 0%, transparent 60%), linear-gradient(155deg, #7c2d12 0%, #ea580c 45%, #fbbf24 100%); }\n  .g-continuous   { background: radial-gradient(120% 80% at 100% 0%, #a7f3d0 0%, transparent 55%), radial-gradient(120% 90% at 0% 100%, #34d399 0%, transparent 60%), linear-gradient(155deg, #06   live: 537, diff: 2, badge: null },\n      { id: 'expected',      g: 'g-expected',      svg: window.__resources.expected_value,                 title: 'Expected Value',          live: 921, diff: 2, badge: { text: 'NEW',   tone: 'violet' } },\n      { id: 'distributions', g: 'g-distributions', svg: window.__resources.distributions,                  title: 'Distributions',           live: 668, diff: 2, badge: null },\n      { id: 'dice',          g: 'g-dice',          svg: window.__resources.dice,                           title: 'Dice & Coins',            live: 305, diff: 1, badge: null },\n      { id: 'covariance',    g: 'g-covariance',    svg: window.__resources.covariance,                     title: 'Covariance',              live: 247, diff: 3, badge: { text: '2× XP', tone: 'amber'  } },\n      { id: 'conditional',   g: 'g-conditional',   svg: window.__resources.conditional_expectation,        title: 'Conditional Expectation', live: 188, diff: 3, badge: null },\n      { id: 'events',        g: 'g-events',        svg: window.__resources.events,                         title: 'Events',                  live: 433, diff: 1, badge: null },\n      { id: 'continuous',    g: 'g-continuous',    svg: window.__resources.continuous_rv,                  title: 'Continuous RVs',          live: 271, diff: 3, badge: null },\n      { id: 'statistics',    g: 'g-statistics',    svg: window.__resources.statistics, shift: 18,          title: 'Statistics',              live: 514, diff: 2, badge: null },\n    ];\n\n    function diffBars(level) {\n      // level 1..3, render 3 bars with N lit\n      let html = '<div class=\"difficulty\" title=\"Difficulty\">';\n      for (let i = 0; i < 3; i++) html += `<span class=\"${i < level ? 'on' : ''}\"><\u002Fspan>`;\n      html += '<\u002Fdiv>';\n      return html;\n    }\n\n    function arcs(id) {\n      return `\n        <svg class=\"arcs\" viewBox=\"0 0 176 234\" preserveAspectRatio=\"xMidYMid slice\" aria-hidden=\"true\">\n          <defs><linearGradient id=\"arc-${id}\" x1=\"0\" x2=\"1\" y1=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\"0.35\"/><stop offset=\"1\" stop-color=\"#fff\" stop-opacity=\"0\"/><\u002FlinearGradient><\u002Fdefs>\n          <g fill=\"none\" stroke=\"url(#arc-${id})\" stroke-width=\"1.1\">\n            <circle cx=\"20\" cy=\"220\" r=\"100\"/><circle cx=\"20\" cy=\"220\" r=\"140\"/>\n            <circle cx=\"165\" cy=\"15\" r=\"70\"/><circle cx=\"165\" cy=\"15\" r=\"110\"/><circle cx=\"165\" cy=\"15\" r=\"150\"/>\n          <\u002Fg>\n        <\u002Fsvg>`;\n    }\n\n    function render() {\n      const grid = document.getElementById('grid');\n      grid.innerHTML = cards.map(c => `\n        <article class=\"game\">\n          <div class=\"card ${c.g}\" style=\"${c.shift ? `--art-shift-x:${c.shift}px;` : ''}\" role=\"button\" tabindex=\"0\" aria-label=\"${c.title}\">\n            ${c.badge ? `<span class=\"badge ${c.badge.tone}\">${c.badge.text}<\u002Fspan>` : ''}\n            ${diffBars(c.diff)}\n            ${arcs(c.id)}\n            <div class=\"gloss\"><\u002Fdiv>\n            <div class=\"art\"><img src=\"${c.svg}\" alt=\"\"><\u002Fdiv>\n            <div class=\"title-wrap\"><h3 class=\"title\">${c.title}<\u002Fh3><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"meta\">\n            <span class=\"live\"><span class=\"dot\"><\u002Fspan><span class=\"count\">${c.live.toLocaleString()}<\u002Fspan> solving<\u002Fspan>\n            <span>${c.diff === 1 ? 'Easy' : c.diff === 2 ? 'Medium' : 'Hard'}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Farticle>\n      `).join('');\n    }\n    render();\n\n    // gentle live-count jitter so it feels alive\n    setInterval(() => {\n      document.querySelectorAll('.game').forEach((el, i) => {\n        const span = el.querySelector('.meta .count');\n        if (!span) return;\n        const delta = Math.floor(Math.random() * 5) - 2;\n        const cur = parseInt(span.textContent.replace(/,/g, ''), 10) + delta;\n        span.textContent = Math.max(10, cur).toLocaleString();\n      });\n    }, 2200);\n  <\u002Fscript>\n\n  \n\n\n<\u002Fbody><\u002Fhtml>"
